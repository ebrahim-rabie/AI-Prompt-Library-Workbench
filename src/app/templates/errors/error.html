{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_class %}page--narrow{% endblock %}

{% block content %}
<section class="panel error-page">
  <p class="error-page__code">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="actions">
    {% if code == 401 %}
      <a class="btn btn--primary" href="{{ url_for('auth.login', next=next_url) }}">Sign in</a>
    {% endif %}
    <a class="btn btn--secondary" href="{{ url_for('pages.home') }}">Go to the home page</a>
  </div>
</section>
{% endblock %}
