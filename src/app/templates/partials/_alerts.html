{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="alerts">
      {% for category, message in messages %}
        <p class="alert alert--{{ category if category in ['success', 'error', 'info'] else 'info' }}" role="status">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
